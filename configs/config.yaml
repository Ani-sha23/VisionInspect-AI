# VisionInspect-AI configuration
# Every tunable number the pipeline uses lives here. No magic numbers in code.

project:
  name: VisionInspect-AI
  seed: 42

data:
  raw_dir: data/raw
  train_csv: data/raw/train.csv
  images_dir: data/raw/train_images
  processed_dir: data/processed
  split:
    val_fraction: 0.15
    test_fraction: 0.15
    # Splits are made on unique ImageId, never on annotation rows, so that two
    # annotations of the same image can never land on both sides of the split.
    stratify_on: defect_signature

preprocessing:
  target_height: 256
  target_width: 1600
  to_grayscale: false
  clahe:
    enabled: true
    clip_limit: 2.0
    tile_grid: 8
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

model:
  name: unet
  in_channels: 3
  num_classes: 4
  base_filters: 32
  weights: models/unet_best.pt
  device: auto           # auto | cpu | cuda
  mask_threshold: 0.50
  min_component_area: 250   # connected components smaller than this are dropped as noise

train:
  epochs: 12
  batch_size: 8
  lr: 0.0003
  weight_decay: 0.00001
  num_workers: 2
  amp: true
  early_stopping_patience: 3
  checkpoint_dir: models

baseline:
  # Classical fallback used when no trained weights are available.
  # It is a localiser, not a classifier: it reports class_id 0 = "unclassified".
  blur_kernel: 5
  block_size: 51           # adaptive threshold window (must be odd)
  c_constant: 7
  morph_kernel: 5
  min_area: 400

severity:
  # calibrated MUST be set to true only after scripts/calibrate_severity.py has
  # written real percentile-derived thresholds below. Until then the pipeline
  # still runs but stamps every result as UNCALIBRATED.
  calibrated: false
  class_weights:      # relative industrial cost of each defect class
    1: 1.0
    2: 1.2
    3: 1.5
    4: 2.0
  weight_area: 0.7
  weight_count: 0.3
  count_saturation: 5     # defect count at which the count term reaches 1.0
  area_scale: 0.08        # area fraction that maps to a full-scale area term
  thresholds:             # severity score (0-100) band edges
    minor_max: 20.0
    moderate_max: 50.0
    severe_max: 80.0

quality:
  accept_max_score: 20.0     # score <= this and no critical class -> ACCEPT
  reject_min_score: 50.0     # score >= this -> REJECT
  critical_classes: [3, 4]   # presence of these forces at least REVIEW
  critical_area_fraction: 0.02   # critical class covering more than this -> REJECT

report:
  output_dir: outputs
  figures_dir: outputs/figures
  save_overlay: true
  overlay_alpha: 0.45

logging:
  level: INFO
  file: outputs/visioninspect.log
