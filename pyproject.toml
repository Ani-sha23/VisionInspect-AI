[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visioninspect-ai"
version = "1.0.0"
description = "Automated surface-defect inspection pipeline for steel sheet images"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "matplotlib>=3.7",
]

[project.scripts]
visioninspect = "visioninspect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
